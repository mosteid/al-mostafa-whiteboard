name: Release Tauri App

on:
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm install

      - name: Build Vendor Files (PDF.js)
        run: npm run vendor

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v1.0.1
          releaseName: 'سبورة المصطفى v1.0.1'
          releaseBody: 'تحديث حل مشكلة تشغيل ملفات الـ PDF'
          releaseDraft: false
          prerelease: false
