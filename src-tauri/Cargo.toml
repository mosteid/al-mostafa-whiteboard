[package]
name = "mostafa-board"
version = "3.0.0"
description = "منصة الأستاذ مصطفى عيد الصافي"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"

# أصغر حجم وأسرع تشغيل
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
